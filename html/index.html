<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>Chat</title>

	<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" name="viewport" />
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />

	<link href="static/styles/style.css" rel="stylesheet" type="text/css">

	<link rel="manifest" href="manifest.webmanifest">
	<meta name="theme-color" content="#7f3f98">
	<link rel="icon" href="static/images/favicon-green.png">
	<link rel="apple-touch-icon" href="static/images/favicon-green.png">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-title" content="Chat">
</head>
<body>
	<div class="app" id="app">
		<div id="login-screen" class="login-screen">
			<div class="login-card">
				<h1>Chat</h1>

				<p id="login-connecting" class="login-connecting" hidden>Rejoining&hellip;</p>

				<div id="login-card-content">
					<div class="room-address">
						<label for="room-address-input">Room address (share to invite)</label>
						<div class="room-address-row">
							<input id="room-address-input" type="text" readonly />
							<button id="copy-room-btn" type="button" class="icon-btn" title="Copy room link" aria-label="Copy room link">
								<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-8a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
							</button>
						</div>
					</div>

					<form id="login-form" autocomplete="off">
						<label for="nick-input">Your nickname</label>
						<input id="nick-input" name="chat-nickname" type="text" maxlength="32" placeholder="e.g. vane" autocomplete="off" data-lpignore="true" data-1p-ignore />

						<label for="password-input">Room password (optional)</label>
						<input id="password-input" name="chat-room-password" type="password" maxlength="128" placeholder="Leave empty for no password" autocomplete="new-password" data-lpignore="true" data-1p-ignore />

						<p id="login-error" class="login-error" hidden></p>
						<button type="submit" class="login-submit-btn">Join Chat</button>
					</form>
				</div>
			</div>
		</div>

		<div id="chat-screen" class="chat" hidden>
			<header class="chat-header">
				<span class="chat-title">Chat</span>
				<button id="online-count" class="online-count" type="button">0 online</button>
				<span class="header-spacer"></span>
				<button id="new_room_btn" class="icon-btn" type="button" title="Start a new room" aria-label="Start a new room">
					<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
				</button>
				<button id="share_btn" class="icon-btn" type="button" title="Copy room link" aria-label="Copy room link">
					<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-8a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
				</button>
				<button id="theme_btn" class="icon-btn" type="button" title="Change theme" aria-label="Change theme"></button>
			</header>

			<div class="chat-body">
				<div id="users-backdrop" class="users-backdrop" hidden></div>
				<aside id="users-panel" class="users-panel">
					<ul id="users" class="users"></ul>
				</aside>

				<div class="chat-main">
					<div id="chat-box" class="chat-box">
						<div id="offline" class="offline" hidden><span class="big">Disconnected</span><br />Trying to reconnect&hellip;</div>
						<ul id="msgs" class="msgs"></ul>
						<ul id="typing" class="typing"></ul>
					</div>
					<div class="chat-form">
						<button id="attach_btn" class="icon-btn attach-btn" type="button" aria-label="Attach file" title="Attach file">
							<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7.5 8.8 15.7a3 3 0 1 1-4.24-4.25L13.5 2.6a2 2 0 1 1 2.83 2.83L8.2 13.5a1 1 0 1 1-1.42-1.42l6.7-6.7"/></svg>
						</button>
						<input id="file_input" type="file" hidden multiple>

						<button id="photo_btn" class="icon-btn attach-btn" type="button" aria-label="Camera or photo library" title="Camera or photo library">
							<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8.5a1.5 1.5 0 0 1 1.5-1.5h1.6l1-1.6a1 1 0 0 1 .85-.5h6.1a1 1 0 0 1 .85.5l1 1.6h1.6A1.5 1.5 0 0 1 20 8.5v9A1.5 1.5 0 0 1 18.5 19h-13A1.5 1.5 0 0 1 4 17.5Z"/><circle cx="12" cy="13" r="3.2"/></svg>
						</button>
						<input id="photo_input" type="file" hidden multiple accept="image/*,video/*">
						<div class="emic-wrap">
							<button id="emic_btn" class="emic-btn" type="button" aria-label="Emoji">
								<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5c1 1.3 2.2 2 3.5 2s2.5-.7 3.5-2"/><circle cx="9" cy="9.5" r=".9" fill="currentColor" stroke="none"/><circle cx="15" cy="9.5" r=".9" fill="currentColor" stroke="none"/></svg>
							</button>
							<ul id="emic" class="emic" hidden></ul>
						</div>
						<textarea id="form_input" class="form-control" data-user-id="2" placeholder="Type a message&hellip;" rows="1"></textarea>
						<button id="send" class="send-btn" type="button">Send</button>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script type="text/javascript" src="socket.io/socket.io.js"></script>
	<script type="text/javascript" src="static/scripts/theme.js"></script>
	<script type="text/javascript" src="static/scripts/emic.js"></script>
	<script type="text/javascript" src="static/scripts/chat.js"></script>
	<script type="text/javascript" src="static/scripts/init.js"></script>
</body>
</html>
